<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomies 見た目の作り直し 2026/11/13</title>
<style>
  /* 世界：夜の部屋のHUD（墨の地・白い文字・黄色のキーワード・紫の帯）。主役はスクリーンショット。遊びは見出しの帯の傾きだけ */
  :root {
    --ground: #17131F;
    --panel: #221C2E;
    --line: #3A3149;
    --text: #F4F0E8;
    --text-sub: #C9C2D4;
    --text-quiet: #9A92A8;
    --accent: #FFD23F;
    --band: #5E3BA6;
    --before: #9A92A8;
    --after: #8CE23C;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #F3EEE3;
      --panel: #FFFFFF;
      --line: #D9D0BF;
      --text: #221A2C;
      --text-sub: #4B4358;
      --text-quiet: #6E667C;
      --accent: #8A6400;
      --band: #5E3BA6;
      --before: #6E667C;
      --after: #2F7A12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    font-weight: 500;
    line-height: 1.7;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    margin: 0 0 12px;
    font-size: 28px;
    font-weight: 900;
    line-height: 1.3;
    font-feature-settings: "palt";
  }
  h1 em { font-style: normal; color: var(--accent); }
  .band {
    display: inline-block;
    margin: 0 0 16px;
    padding: 4px 12px;
    background: var(--band);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    transform: rotate(-1.6deg);
  }
  .lead { margin: 0 0 24px; color: var(--text-sub); font-size: 15px; }
  h2 {
    margin: 48px 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--line);
    font-size: 22px;
    font-weight: 900;
    line-height: 1.3;
    font-feature-settings: "palt";
  }
  .note { margin: 0 0 16px; color: var(--text-sub); font-size: 14px; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 0 0 24px; }
  @media (min-width: 820px) { .pair { grid-template-columns: 1fr 1fr; } }
  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  figure.wide { margin: 0 0 24px; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 16px 16px; font-size: 14px; color: var(--text-sub); }
  .tag {
    display: inline-block;
    margin-right: 8px;
    padding: 0 8px;
    border: 1px solid currentColor;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.8;
  }
  .tag.before { color: var(--before); }
  .tag.after { color: var(--after); }
  footer { margin-top: 48px; color: var(--text-quiet); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Roomies の<em>見た目</em>を作り直した</h1>
  <p class="band">2026/11/13 ブランチ art/restyle-20261113</p>
  <p class="lead">Play はしていません。どれも編集中のシーンを撮影用のカメラで撮ったものです。</p>

  <figure class="wide">
    <a href="compare_reference.jpg"><img src="compare_reference.jpg" alt="参考画像と作り直し後の比較"></a>
    <figcaption>左上が参考画像、右上が新しいタイトル、左下が作り直す前の部屋、右下が作り直したあとの部屋とHUD</figcaption>
  </figure>

  <h2>部屋</h2>
  <div class="pair">
    <figure>
      <a href="before_room_night.jpg"><img src="before_room_night.jpg" alt="作り直す前の部屋（夜）" loading="lazy"></a>
      <figcaption><span class="tag before">前</span>入口側から見た夜の部屋。ソファと机だけ</figcaption>
    </figure>
    <figure>
      <a href="after_room_night_nopost.jpg"><img src="after_room_night_nopost.jpg" alt="作り直したあとの部屋（夜・画面の仕上げなし）" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>同じ向き。画面の仕上げ（Bloom など）なしで、今のゲーム中の見え方に近い</figcaption>
    </figure>
  </div>
  <div class="pair">
    <figure>
      <a href="before_room_back.jpg"><img src="before_room_back.jpg" alt="作り直す前の部屋（奥から）" loading="lazy"></a>
      <figcaption><span class="tag before">前</span>奥のベッド側から入口を見たところ</figcaption>
    </figure>
    <figure>
      <a href="after_room_back.jpg"><img src="after_room_back.jpg" alt="作り直したあとの部屋（奥から）" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>同じ向き。ベッドの見た目も差し替えた</figcaption>
    </figure>
  </div>
  <div class="pair">
    <figure>
      <a href="before_house_ext.jpg"><img src="before_house_ext.jpg" alt="作り直す前の家の外観" loading="lazy"></a>
      <figcaption><span class="tag before">前</span>夜の家を外から</figcaption>
    </figure>
    <figure>
      <a href="after_house_ext.jpg"><img src="after_house_ext.jpg" alt="作り直したあとの家の外観" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>窓から部屋の明かりが見える。外の壁の色も変わった</figcaption>
    </figure>
  </div>
  <div class="pair">
    <figure>
      <a href="after_lounge.jpg"><img src="after_lounge.jpg" alt="ソファとこたつ" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>黄色いソファ、こたつ、台所、ネオンの猫「うえい」</figcaption>
    </figure>
    <figure>
      <a href="after_desk_shelf.jpg"><img src="after_desk_shelf.jpg" alt="パソコン机と棚" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>東の壁。パソコン机、棚のパチスロ台、段ボールとサメ</figcaption>
    </figure>
    <figure>
      <a href="after_south_wall.jpg"><img src="after_south_wall.jpg" alt="南の壁" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>南の壁。ダーツ、バスケのゴール、貼り紙「今週の目標」</figcaption>
    </figure>
    <figure>
      <a href="after_room_day.jpg"><img src="after_room_day.jpg" alt="作り直したあとの部屋（朝）" loading="lazy"></a>
      <figcaption><span class="tag after">後</span>朝の見え方</figcaption>
    </figure>
  </div>

  <h2>HUD</h2>
  <p class="note">作り直す前のHUDだけのスクリーンショットは残していません。</p>
  <figure class="wide">
    <a href="after_room_night_hud.jpg"><img src="after_room_night_hud.jpg" alt="作り直したあとのHUD" loading="lazy"></a>
    <figcaption><span class="tag after">後</span>左上に日数と残り時間、右上に共同口座（残り日数だけ赤）、左下に貼り紙風の「いまの目標」。数字は見本の値</figcaption>
  </figure>

  <h2>タイトル</h2>
  <p class="note">作り直す前のタイトルのスクリーンショットは残していません。</p>
  <figure class="wide">
    <a href="after_title.jpg"><img src="after_title.jpg" alt="作り直したあとのタイトル" loading="lazy"></a>
    <figcaption><span class="tag after">後</span>背景を夜の部屋に。見出しは左上の1行で「家賃」を黄色、主ボタンも黄色。キャラをカメラ向きに置き直した</figcaption>
  </figure>

  <footer>画像を押すと元の大きさで開きます。</footer>
</main>
</body>
</html>
