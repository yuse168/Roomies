<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomies 見た目 2026/11/13</title>
<style>
  :root { --ground:#17131F; --panel:#221C2E; --line:#3A3149; --text:#F4F0E8; --sub:#C9C2D4; --accent:#FFD23F; }
  @media (prefers-color-scheme: light) {
    :root { --ground:#F3EEE3; --panel:#FFFFFF; --line:#D9D0BF; --text:#221A2C; --sub:#4B4358; --accent:#8A6400; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--text); line-height:1.7; font-weight:500;
    font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Noto Sans JP",sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; font-weight:900; line-height:1.3; }
  .lead { margin:0 0 24px; color:var(--sub); }
  figure { margin:0 0 28px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  img { display:block; width:100%; height:auto; }
  figcaption { padding:10px 16px 14px; color:var(--sub); }
  figcaption b { color:var(--accent); margin-right:8px; }
</style>
</head>
<body>
<main>
  <h1>Roomies 見た目 2026/11/13</h1>
  <p class="lead">家賃に追われるルームシェアの夜。作り直した見た目のスクリーンショットです（開発中の画面）。</p>
  <figure><img src="01_title.jpg" alt="タイトル画面" width="1920" height="1080"><figcaption><b>01 タイトル</b>夜の部屋が背景。「3日後の家賃、払える？」から始まります。</figcaption></figure>
  <figure><img src="02_lobby.jpg" alt="ロビー画面" width="1920" height="1080"><figcaption><b>02 ロビー</b>フレンドを招待して、みんなが集まったらゲーム開始。</figcaption></figure>
  <figure><img src="03_room_night_hud.jpg" alt="夜の部屋とHUD" width="1920" height="1080"><figcaption><b>03 ゲーム中（夜）</b>共同口座・残り時間・今日の目標が見えるHUD付き。数字は見本です。</figcaption></figure>
  <figure><img src="04_lounge.jpg" alt="ソファとこたつ" width="1920" height="1080"><figcaption><b>04 リビング</b>黄色いソファ、こたつ、ネオンの猫。散らかった部屋がホームです。</figcaption></figure>
  <figure><img src="05_room_morning.jpg" alt="朝の部屋" width="1920" height="1080"><figcaption><b>05 部屋（朝）</b>窓から光が入る朝の部屋。夜との雰囲気の違い。</figcaption></figure>
</main>
</body>
</html>
