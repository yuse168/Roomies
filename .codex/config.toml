# Unity 6のAI Assistantが生成したRelayをstdio MCPとして起動し、
# 開いているRoomiesのEditorインスタンスへ接続する。
[mcp_servers.RoomiesUnity]
enabled = true
required = false
command = 'C:\Users\So2e\.unity\relay\relay_win.exe'
args = ["--mcp", "--name", "Roomies Unity", "--project-path", "C:\\#Project\\team_project\\Roomies"]
startup_timeout_sec = 30.0
tool_timeout_sec = 120.0
